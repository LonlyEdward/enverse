# Development stack. The backend, Celery worker and Celery beat all share one
# image and the same .env; only their commands differ (captured by the anchor
# below). Production builds the image from backend/Dockerfile and runs Gunicorn.

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - .env
  # Dev-friendly defaults so a fresh clone boots even with a minimal .env.
  # Anything set in .env (or the shell) overrides these. Production (Railway)
  # does not use this compose file and must set real values.
  environment:
    SECRET_KEY: ${SECRET_KEY:-dev-local-secret-not-for-production}
    DEBUG: ${DEBUG:-True}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  volumes:
    - ./backend:/app  # bind mount for live reload in development
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  backend:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

  celery-worker:
    <<: *backend
    command: celery -A config worker -l info

  celery-beat:
    <<: *backend
    # Keep the scheduler's state file out of the bind-mounted source tree.
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      # The browser calls the API directly, so this points at the host, not the
      # Docker-internal backend hostname.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      # Anonymous volume keeps the image's installed node_modules from being
      # hidden by the bind mount above.
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
